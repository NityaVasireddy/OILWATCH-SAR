[project]
name = "oilwatch-sar"
version = "0.1.0"
requires-python = ">=3.12,<3.15"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "Pillow>=10.4",
    "PyYAML>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "shapely>=2.0",
    "geopandas>=1.0",
    "rasterio>=1.3",
    "matplotlib>=3.9",
    "torch>=2.4",
    "torchvision>=0.19",
    "rarfile>=4.2"
]

[tool.vercel]
entrypoint = "backend.main:app"